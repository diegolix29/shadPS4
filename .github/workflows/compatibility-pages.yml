name: Compatibility website

on:
  push:
    branches: [main]
    paths:
      - "compatibility-site/**"
      - "scripts/compatibility/**"
      - ".agents/skills/bachata-compatibility/**"
      - ".github/workflows/compatibility-pages.yml"
  pull_request:
    paths:
      - "compatibility-site/**"
      - "scripts/compatibility/**"
      - ".agents/skills/bachata-compatibility/**"
      - ".github/workflows/compatibility-pages.yml"
  repository_dispatch:
    types: [compatibility-data-updated]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: compatibility-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Bachata S4 frontend
        uses: actions/checkout@v4
        with:
          path: bachata

      - name: Check out compatibility source data
        uses: actions/checkout@v4
        with:
          repository: JICA98/Bachata-S4-Compatibility
          ref: main
          path: compatibility

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate immutable source data
        working-directory: compatibility
        run: python3 scripts/validate.py

      - name: Generate compact and per-game indexes
        working-directory: compatibility
        run: python3 scripts/build_site_data.py --output generated

      - name: Check frontend source
        working-directory: bachata
        run: |
          node --check compatibility-site/assets/js/app.js
          bash -n scripts/compatibility/capture_android_report.sh

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a bachata/compatibility-site _site
          mkdir -p _site/data _site/evidence
          cp compatibility/generated/site-index.json _site/data/site-index.json
          cp compatibility/generated/releases.json _site/data/releases.json
          cp -a compatibility/generated/games _site/data/games
          (
            cd compatibility
            find assets -type f -path '*/screenshots/*' -exec cp --parents '{}' ../_site/evidence/ \;
          )
          oversized="$(find _site -type f -size +25M -print -quit)"
          if [[ -n "$oversized" ]]; then
            echo "A deployed file exceeds 25 MiB: $oversized" >&2
            exit 1
          fi
          total_kib="$(du -sk _site | awk '{print $1}')"
          if (( total_kib >= 900000 )); then
            echo "Pages artifact exceeds the 900 MiB safety budget." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
