name: Compatibility website

on:
  push:
    branches: [main]
    paths:
      - "compatibility-site/**"
      - "scripts/compatibility/**"
      - ".agents/skills/bachata-compatibility/**"
      - ".github/workflows/compatibility-pages.yml"
  pull_request:
    paths:
      - "compatibility-site/**"
      - "scripts/compatibility/**"
      - ".agents/skills/bachata-compatibility/**"
      - ".github/workflows/compatibility-pages.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compatibility-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize GitHub release index
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/compatibility/sync_releases.py

      - name: Validate compatibility database
        run: python3 scripts/compatibility/validate_database.py

      - name: Check scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check compatibility-site/assets/js/app.js
          bash -n scripts/compatibility/capture_android_report.sh
          python3 -m py_compile \
            scripts/compatibility/add_report.py \
            scripts/compatibility/sync_releases.py \
            scripts/compatibility/validate_database.py

      - name: Enforce Pages artifact limits
        shell: bash
        run: |
          set -euo pipefail
          oversized="$(find compatibility-site -type f -size +25M -print)"
          if [[ -n "$oversized" ]]; then
            echo "Individual website files must stay under 25 MiB:" >&2
            echo "$oversized" >&2
            exit 1
          fi
          total_kib="$(du -sk compatibility-site | awk '{print $1}')"
          if (( total_kib > 900000 )); then
            echo "Compatibility website exceeds the safe 900 MiB Pages budget." >&2
            exit 1
          fi

      - name: Commit synchronized release index
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- compatibility-site/data/releases.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compatibility-site/data/releases.json
          git commit -m "chore: sync compatibility release index"
          git push || echo "warning: release index could not be pushed; the deployed artifact is still current"

      - name: Upload validated website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: compatibility-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
